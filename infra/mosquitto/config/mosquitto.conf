# Configuração do Mosquitto com Autenticação e ACL (T06 / T07)

# Porta 1883 para comunicação interna dos containers (Node-RED)
listener 1883

# Porta 8883 para comunicação externa dos dispositivos (ESP32 Master / Wokwi / MQTTX)
listener 8883

# Segurança e Controle de Acesso (T07)
# Proíbe conexões anônimas em ambas as portas
allow_anonymous false

# Arquivo de senhas gerado via mosquitto_passwd
password_file /mosquitto/config/passwd

# Regras de controle de acesso por usuário e tópico
acl_file /mosquitto/config/mosquitto.acl

# Persistência e Logs
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
