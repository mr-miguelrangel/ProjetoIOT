# Configuração do Mosquitto com Autenticação, ACL e TLS (T06 / T07 / T09)

# ------------------------------------------------------------------------------
# Porta 1883: Comunicação interna entre containers (Node-RED na mesma rede Docker)
# ATENÇÃO: Nunca expor a porta 1883 no host da VM pública!
# ------------------------------------------------------------------------------
listener 1883

# ------------------------------------------------------------------------------
# Porta 8883: Comunicação externa segura com TLS (ESP32 Master / Wokwi / MQTTX)
# ------------------------------------------------------------------------------
listener 8883

# Certificados TLS para a porta 8883
# Em desenvolvimento: certificados gerados por infra/mosquitto/certs/generate-certs.sh
# Em produção: montados via volume do Caddy ou certificados emitidos pelo Let's Encrypt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Versões mínimas de TLS seguras
tls_version tlsv1.2

# ------------------------------------------------------------------------------
# Segurança e Controle de Acesso (T07)
# ------------------------------------------------------------------------------
# Proíbe conexões anônimas em ambas as portas
allow_anonymous false

# Arquivo de senhas gerado via mosquitto_passwd
password_file /mosquitto/config/passwd

# Regras de controle de acesso por usuário e tópico
acl_file /mosquitto/config/mosquitto.acl

# ------------------------------------------------------------------------------
# Persistência e Logs
# ------------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
