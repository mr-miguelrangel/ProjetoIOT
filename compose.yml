services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  nodered:
    build: ./nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      # A pasta nodered/ vira o /data do Node-RED: o flows.json versionado
      # é carregado ao subir e as alterações feitas no editor voltam para o repositório.
      - ./nodered:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
